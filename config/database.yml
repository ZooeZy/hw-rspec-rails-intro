
# Database configuration for RottenPotatoes
#
# Development and test environments use SQLite3.
# Production on Heroku uses PostgreSQL.

development:
  adapter: sqlite3
  database: db/development.sqlite3
  pool: 5
  timeout: 5000

# The test database is separate from development.
test: &test
  adapter: sqlite3
  database: db/test.sqlite3
  pool: 5
  timeout: 5000

# Heroku provides DATABASE_URL for its PostgreSQL add-on.
production:
  adapter: postgresql
  encoding: unicode
  pool: 5
  url: <%= ENV['DATABASE_URL'] %>

# Cucumber uses the same database settings as test.
cucumber:
  <<: *test
